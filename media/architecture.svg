<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Open Tutor architecture</title>
  <desc id="d">An iPad sends strokes and audio to one Apple-silicon Mac. On the Mac, a session agent segments, reads (Qwen3.5-4B), checks (deterministic checkers) and tutors (Gemma 4), with local voice models and local storage. A cloud provider is optional and off by default.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1b1d22; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .h1 { font-size: 30px; font-weight: 800; }
      .sub { font-size: 17px; fill: #5d6169; }
      .h { font-size: 18px; font-weight: 700; }
      .t { font-size: 14px; fill: #5d6169; }
      .s { font-size: 13px; fill: #5d6169; }
      .chip { font-size: 12.5px; fill: #1f5a37; }
      .local { fill: #2f7d4f; }
      .box { fill: #ffffff; stroke: #1b1d22; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #cdd5cf; stroke-width: 1.5; }
      .key { fill: #eef6f0; stroke: #2f7d4f; stroke-width: 2; }
      .chipbg { fill: #e3efe6; }
      .wire { stroke: #1b1d22; stroke-width: 1.8; fill: none; }
      .opt { stroke: #9a9ea6; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; }
      .n { font-size: 13px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b1d22"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9ea6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="20" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="58" class="h1">Open Tutor · architecture</text>
  <text x="40" y="90" class="sub">Every model runs on the Mac. No network call is needed to read, check or tutor.</text>

  <!-- optional cloud, outside the Mac -->
  <rect x="1220" y="24" width="340" height="86" rx="12" fill="#f6f6f4" stroke="#9a9ea6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1242" y="58" class="h" style="fill:#5d6169">Cloud provider (Claude / OpenAI)</text>
  <text x="1242" y="84" class="t">off by default · per-session opt-in</text>

  <!-- device -->
  <rect x="30" y="300" width="226" height="300" rx="16" class="box"/>
  <text x="50" y="338" class="h" style="font-size:22px">iPad</text>
  <text x="50" y="362" class="t">Safari · Apple Pencil</text>
  <rect x="46" y="384" width="194" height="58" rx="10" fill="#f5f5f2" stroke="#d4d2ca"/>
  <text x="62" y="408" class="h" style="font-size:16px">Canvas (React)</text>
  <text x="62" y="429" class="s">ink + tutor layers</text>
  <rect x="46" y="454" width="194" height="58" rx="10" fill="#f5f5f2" stroke="#d4d2ca"/>
  <text x="62" y="478" class="h" style="font-size:16px">Mic · speaker</text>
  <text x="62" y="499" class="s">voice-activated, no button</text>
  <text x="50" y="548" class="s">or the Mac's own browser</text>
  <text x="50" y="572" class="s mono">WebSocket · LAN or HTTPS</text>

  <!-- the Mac boundary -->
  <rect x="380" y="140" width="1180" height="732" rx="20" fill="#f4f9f5" stroke="#2f7d4f" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="404" y="178" class="h local" style="font-size:19px">Apple-silicon Mac · all inference local</text>
  <rect x="790" y="158" width="190" height="28" rx="14" fill="#2f7d4f"/>
  <text x="885" y="177" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#ffffff">offline after setup</text>

  <!-- session agent -->
  <rect x="430" y="206" width="1100" height="336" rx="14" class="panel"/>
  <text x="452" y="238" class="h">Session agent</text>
  <text x="580" y="238" class="t mono">FastAPI · :8000</text>

  <!-- 1 segment -->
  <rect x="446" y="266" width="240" height="206" rx="12" class="box"/>
  <circle cx="470" cy="292" r="12" fill="#1b1d22"/><text x="470" y="297" text-anchor="middle" class="n">1</text>
  <text x="490" y="298" class="h">Segment</text>
  <text x="466" y="332" class="t">strokes → line regions</text>
  <text x="466" y="354" class="t">graded once a line settles</text>
  <rect x="462" y="428" width="208" height="28" rx="8" class="chipbg"/>
  <text x="476" y="447" class="chip mono">code</text>

  <!-- 2 read -->
  <rect x="722" y="266" width="240" height="206" rx="12" class="box"/>
  <circle cx="746" cy="292" r="12" fill="#1b1d22"/><text x="746" y="297" text-anchor="middle" class="n">2</text>
  <text x="766" y="298" class="h">Read</text>
  <text x="742" y="332" class="t">handwriting → text, LaTeX</text>
  <text x="742" y="354" class="t">photos of paper, on demand</text>
  <rect x="738" y="392" width="208" height="28" rx="8" class="chipbg"/>
  <text x="752" y="411" class="chip mono">Qwen3.5-4B · MLX</text>
  <rect x="738" y="428" width="208" height="28" rx="8" class="chipbg"/>
  <text x="752" y="447" class="chip mono">Chandra OCR 2 · MLX</text>

  <!-- 3 check -->
  <rect x="998" y="266" width="240" height="206" rx="12" class="key"/>
  <circle cx="1022" cy="292" r="12" fill="#2f7d4f"/><text x="1022" y="297" text-anchor="middle" class="n">3</text>
  <text x="1042" y="298" class="h">Check</text>
  <text x="1018" y="332" class="t">sympy · ledgers · sudoku</text>
  <text x="1018" y="354" class="t">graph rules</text>
  <text x="1018" y="376" class="t">deterministic ✓ / ✗</text>
  <rect x="1014" y="428" width="208" height="28" rx="8" class="chipbg"/>
  <text x="1028" y="447" class="chip mono">code, not the model</text>

  <!-- 4 tutor -->
  <rect x="1274" y="266" width="240" height="206" rx="12" class="box"/>
  <circle cx="1298" cy="292" r="12" fill="#1b1d22"/><text x="1298" y="297" text-anchor="middle" class="n">4</text>
  <text x="1318" y="298" class="h">Tutor</text>
  <text x="1294" y="332" class="t">places marks, writes hints</text>
  <text x="1294" y="354" class="t">never overrules a checker</text>
  <rect x="1290" y="392" width="208" height="28" rx="8" class="chipbg"/>
  <text x="1304" y="411" class="chip mono">Gemma 4 26B-A4B</text>
  <rect x="1290" y="428" width="208" height="28" rx="8" class="chipbg"/>
  <text x="1304" y="447" class="chip mono">mlx-vlm · 127.0.0.1</text>

  <path d="M686 369 H 718" class="wire" marker-end="url(#a)"/>
  <path d="M962 369 H 994" class="wire" marker-end="url(#a)"/>
  <path d="M1238 369 H 1270" class="wire" marker-end="url(#a)"/>

  <!-- output -->
  <rect x="446" y="490" width="1068" height="36" rx="8" fill="#f5f5f2"/>
  <text x="466" y="514" class="t"><tspan style="fill:#1b1d22;font-weight:700">Output</tspan>   ✓ ✗ underline anchored to the line  ·  hint ladder: nudge → rule → corrected step → solution only on request</text>

  <!-- voice -->
  <rect x="430" y="566" width="1100" height="150" rx="14" class="panel"/>
  <text x="452" y="598" class="h">Voice</text>
  <text x="510" y="598" class="t">loaded on demand</text>
  <rect x="452" y="618" width="230" height="74" rx="10" class="box"/>
  <text x="470" y="648" class="h" style="font-size:16px">Silero VAD</text>
  <text x="470" y="672" class="s">detects speech</text>
  <rect x="732" y="618" width="230" height="74" rx="10" class="box"/>
  <text x="750" y="648" class="h" style="font-size:16px">Parakeet TDT 0.6B</text>
  <text x="750" y="672" class="s">speech → text · MLX</text>
  <rect x="1012" y="618" width="230" height="74" rx="10" fill="#ffffff" stroke="#1b1d22" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="648" class="h" style="font-size:16px">Session agent</text>
  <text x="1030" y="672" class="s">answers about the page</text>
  <rect x="1292" y="618" width="230" height="74" rx="10" class="box"/>
  <text x="1310" y="648" class="h" style="font-size:16px">Kokoro-82M</text>
  <text x="1310" y="672" class="s">text → speech · MLX</text>
  <path d="M682 655 H 728" class="wire" marker-end="url(#a)"/>
  <path d="M962 655 H 1008" class="wire" marker-end="url(#a)"/>
  <path d="M1242 655 H 1288" class="wire" marker-end="url(#a)"/>

  <!-- storage -->
  <rect x="430" y="740" width="540" height="112" rx="14" class="panel"/>
  <ellipse cx="482" cy="774" rx="26" ry="9" fill="#e3efe6" stroke="#2f7d4f" stroke-width="1.5"/>
  <path d="M456 774 V 816 A 26 9 0 0 0 508 816 V 774" fill="#e3efe6" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="530" y="778" class="h">SQLite on disk</text>
  <text x="530" y="802" class="t">sessions · strokes · marks · progress</text>
  <text x="530" y="826" class="t">teacher view reads it locally</text>

  <rect x="990" y="740" width="540" height="112" rx="14" class="panel"/>
  <ellipse cx="1042" cy="774" rx="26" ry="9" fill="#e3efe6" stroke="#2f7d4f" stroke-width="1.5"/>
  <path d="M1016 774 V 816 A 26 9 0 0 0 1068 816 V 774" fill="#e3efe6" stroke="#2f7d4f" stroke-width="1.5"/>
  <text x="1090" y="778" class="h">Model weights on disk</text>
  <text x="1090" y="802" class="t">pinned revisions · downloaded once</text>
  <text x="1090" y="826" class="t mono">HF_HUB_OFFLINE=1</text>
  <!-- wires on top -->
  <path d="M258 384 H 442" class="wire" marker-end="url(#a)"/>
  <text x="268" y="372" class="s">strokes · audio</text>
  <path d="M430 508 H 260" class="wire" marker-end="url(#a)"/>
  <text x="268" y="532" class="s">marks · speech</text>
  <path d="M1394 110 V 264" class="opt" marker-end="url(#ag)"/>
  <rect x="1402" y="118" width="186" height="20" fill="#ffffff"/>
  <text x="1404" y="133" class="s">opt-in: tutoring step only</text>
</svg>
